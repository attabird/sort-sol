<!doctype html><html lang="en"><head><meta name="robots" content="noindex"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sort Sol True to Nature</title>
<style>@font-face{font-family:"Fraunces";src:url("assets/fonts/fraunces-italic.woff2") format("woff2");font-style:italic;font-weight:100 900;font-display:swap}</style>
<style>
  /* Layout: one full-bleed dusk scene. Type sits in the margins like a field note:
     title high in the dark of the sky, caption low left, controls low right. */
  :root {
    --night: #070a14;
    --ink: #f4e7d4;
    --ink-dim: rgba(244, 231, 212, 0.66);
    --line: rgba(244, 231, 212, 0.26);
    --ember: #ffb478;
    --display: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --utility: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { background: var(--night); color: var(--ink); font-family: var(--utility); overflow: hidden; }

  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 80% at 50% 55%, rgba(7, 10, 20, 0) 52%, rgba(7, 10, 20, 0.5) 100%); }
  /* the edges close in while the view turns hard, which is easier on the stomach; the camera sets how far */
  .vignette.turn { opacity: 0; background: radial-gradient(ellipse 88% 84% at 50% 52%, rgba(20, 16, 30, 0) 50%, rgba(20, 16, 30, 0.6) 100%); }
  .veil { position: fixed; inset: 0; pointer-events: none; background: var(--night); opacity: 1; transition: opacity 2.8s ease; }
  .veil.clear { opacity: 0; }
  .veil.quick { transition-duration: 0.7s; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding-block: calc(env(safe-area-inset-top, 0px) + clamp(18px, 4vh, 44px)) calc(env(safe-area-inset-bottom, 0px) + clamp(16px, 3.2vh, 34px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hud-inner { display: contents; }
  .title, .foot { margin-inline: clamp(0px, 2.4vw, 34px); }
  .title { transition: opacity 3.2s ease; }
  .title.gone { opacity: 0; }
  .title h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; line-height: 0.92;
    font-size: clamp(3.4rem, 11vw, 9rem); letter-spacing: -0.012em; text-wrap: balance;
    text-shadow: 0 2px 40px rgba(7, 10, 20, 0.45); }
  .title p { margin: 1.1em 0 0 0.35em; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-dim); }

  .foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .caption { margin: 0; min-width: 0; font-size: 0.7rem; line-height: 1.7; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-dim); transition: opacity 1.2s ease; text-shadow: 0 1px 12px rgba(7, 10, 20, 0.8); }
  .caption.swap { opacity: 0; }
  .notes { min-width: 0; }
  .credit { margin: 0.55em 0 0; font-size: 0.62rem; line-height: 1.7; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-dim); opacity: 0.8; text-shadow: 0 1px 12px rgba(7, 10, 20, 0.8); }
  .hint { margin: 0.55em 0 0; font-size: 0.62rem; line-height: 1.7; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--ink-dim); text-shadow: 0 1px 12px rgba(7, 10, 20, 0.8); transition: opacity 1.6s ease; }
  .hint.used { opacity: 0; }
  .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; pointer-events: auto; }
  .controls button { font: inherit; font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink);
    background: rgba(7, 10, 20, 0.28); border: 1px solid var(--line); border-radius: 2px; min-height: 40px; padding: 0 1.15em;
    cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: border-color 0.25s, color 0.25s, background 0.25s; }
  .controls button:hover { border-color: var(--ink); }
  .chan { display: flex; align-items: center; gap: 8px; }
  .vol { -webkit-appearance: none; appearance: none; width: 72px; height: 40px; margin: 0; padding: 0; background: transparent; cursor: pointer; }
  .vol::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 1px; }
  .vol::-moz-range-track { height: 2px; background: var(--line); border-radius: 1px; }
  .vol::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; margin-top: -5px; border: 0; border-radius: 50%; background: var(--ink); }
  .vol::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--ink); }
  .chan button[aria-pressed="true"] + .vol::-webkit-slider-thumb { background: var(--ember); }
  .chan button[aria-pressed="true"] + .vol::-moz-range-thumb { background: var(--ember); }
  .vol:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .vol:disabled { opacity: 0.35; cursor: default; }
  .controls button:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .controls button[aria-pressed="true"] { color: var(--ember); border-color: var(--ember); }
  .inline .hud, .inline .fallback { display: none !important; }
  .inline #sky { touch-action: auto; }   /* inline the page scrolls through this sky, so it must never claim a swipe */
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dim);
    font-size: 0.8rem; letter-spacing: 0.08em; line-height: 1.8; }
</style>

<canvas id="sky" role="img" aria-label="A starling murmuration over a marsh at dusk. The view begins on the ground, rises toward the flock and ends flying inside it."></canvas>
<div class="vignette"></div>
<div class="vignette turn" id="turnVig"></div>
<div class="veil" id="veil"></div>
<div class="hud">
  <header class="title" id="title">
    <h1>Sort sol</h1>
    <p>Ribemarsken &middot; flown by the field measurements</p>
  </header>
  <div class="foot">
    <div class="notes">
      <p class="caption" id="caption">Dusk &middot; watching from the dike</p>
      <p class="hint" id="hint">Scroll to move through the evening</p>
      <p class="hint" id="hintStartle">Click the flock to startle it</p>
      <p class="credit">Created by Henrik Pultz Melbye</p>
    </div>
    <div class="controls">
      <div class="chan">
        <button id="sound" type="button" aria-pressed="false">Sound off</button>
        <input id="soundVol" class="vol" type="range" min="0" max="100" value="60" aria-label="Sound volume">
      </div>
      <div class="chan">
        <button id="music" type="button" aria-pressed="false">Music off</button>
        <input id="musicVol" class="vol" type="range" min="0" max="100" value="60" aria-label="Music volume">
      </div>
      <button id="replay" type="button">Replay</button>
    </div>
  </div>
</div>
<p class="fallback" id="fallback" hidden>This animation needs WebGL 2, which this browser does not offer.</p>

<script>
(() => {
  'use strict';
  // ?inline: the scene sits inside a section of attabird.com that you scroll past. The page sets how far along the
  // journey the view is (from the scroll); the scene draws no controls.
  // &still=1 or &still=0 passes on the site's own Motion switch, which outranks the device setting.
  const Q = new URLSearchParams(location.search), inline = Q.has('inline');
  document.documentElement.classList.toggle('inline', inline);
  const canvas = document.getElementById('sky');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) { document.getElementById('fallback').hidden = false; return; }

  /* ---------- small helpers ---------- */
  let seedState = 20261113;
  const rnd = () => { seedState |= 0; seedState = seedState + 0x6D2B79F5 | 0; let t = Math.imul(seedState ^ seedState >>> 15, 1 | seedState);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  // a second generator for what differs from one viewing to the next (the falcon, which bird the camera rides);
  // it starts somewhere new every time, and a test can fix it to get the same run twice
  let seed2 = (Math.random() * 4294967296) | 0;
  const rnd2 = () => { seed2 = seed2 + 0x6D2B79F5 | 0; let t = Math.imul(seed2 ^ seed2 >>> 15, 1 | seed2);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const sstep = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * x * (x * (x * 6 - 15) + 10); };
  const mix = (a, b, t) => a + (b - a) * t;

  function shader(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
    return s;
  }
  function program(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }

  /* ---------- sky, sun, marsh ---------- */
  const skyProg = program(`#version 300 es
    out vec2 vNdc;
    void main(){ vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)); vNdc = p * 2.0 - 1.0; gl_Position = vec4(vNdc, 0.0, 1.0); }`,
  `#version 300 es
    precision highp float;
    in vec2 vNdc; out vec4 o;
    uniform vec3 uR, uU, uF, uCam, uSun;
    uniform float uTan, uAspect, uTime, uPix;

    float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++){ s += a * vn(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }

    // light values may exceed 1 here; they are rolled off at the end like a camera would
    vec3 sky(vec3 d, float withClouds){
      float h = max(d.y, 0.0);
      float sd = max(dot(d, uSun), 0.0);
      float az = clamp(dot(normalize(d.xz + 1e-5), normalize(uSun.xz)) * 0.5 + 0.5, 0.0, 1.0);
      vec3 zen = vec3(0.040, 0.075, 0.170);
      vec3 midc = mix(vec3(0.150, 0.205, 0.340), vec3(0.330, 0.320, 0.400), az);
      vec3 hor = mix(vec3(0.400, 0.350, 0.420), vec3(1.150, 0.560, 0.210), pow(az, 2.0));
      vec3 c = mix(zen, midc, exp(-h * 3.2));
      c = mix(c, hor, exp(-h * 9.0));
      c += vec3(0.80, 0.62, 0.26) * exp(-h * 16.0) * pow(az, 5.0) * 0.30;
      c += vec3(1.0, 0.48, 0.15) * pow(sd, 8.0) * 0.40 * exp(-h * 2.5);
      c += vec3(1.0, 0.68, 0.34) * pow(sd, 64.0) * 0.55;
      c += vec3(1.0, 0.86, 0.62) * pow(sd, 700.0) * 1.0;
      float ang = acos(clamp(dot(d, uSun), -1.0, 1.0));
      c = mix(c, vec3(7.0, 4.6, 2.2), 1.0 - smoothstep(0.0095, 0.0110, ang));
      if (withClouds > 0.5) {
        vec2 uv = d.xz / (d.y + 0.11);
        float n = fbm(uv * vec2(0.42, 2.3) + vec2(uTime * 0.006, 0.0));
        float n2 = fbm(uv * vec2(1.3, 5.5) + 9.0);
        float cl = smoothstep(0.50, 0.80, n + n2 * 0.18) * exp(-h * 2.2) * smoothstep(0.0, 0.045, d.y);
        vec3 cc = mix(vec3(0.200, 0.200, 0.285), vec3(1.10, 0.50, 0.22), pow(az, 2.5) * exp(-h * 3.5));
        cc += vec3(1.0, 0.55, 0.3) * pow(sd, 24.0) * 0.6;
        c = mix(c, cc, cl * 0.80);
        vec2 uv2 = d.xz / (d.y + 0.35);
        float ci = smoothstep(0.55, 0.85, fbm(uv2 * vec2(1.1, 3.6) + 21.0)) * smoothstep(0.08, 0.3, d.y);
        c = mix(c, c + vec3(0.30, 0.17, 0.15) * (0.4 + 0.6 * az), ci * 0.5);
      }
      return c;
    }

    void main(){
      vec3 d = normalize(uF + uR * (vNdc.x * uAspect * uTan) + uU * (vNdc.y * uTan));
      vec3 c;
      if (d.y >= 0.0) {
        c = sky(d, 1.0);
        float a = atan(d.x, -d.z);
        // the marsh is flat: only a low far dike closes the horizon
        float th = 0.0009 * (1.0 - smoothstep(3.0, 45.0, uCam.y));
        c = mix(c, vec3(0.040, 0.036, 0.045) + c * 0.08, smoothstep(th, th - 0.0005, d.y));
      } else {
        float t = uCam.y / (-d.y);
        vec2 P = uCam.xz + d.xz * t;
        float lod = clamp(t / 3500.0, 0.0, 1.0);
        float foot = t * uPix / max(-d.y, 0.02);            // metres one pixel covers on the ground
        float nearMask = smoothstep(13.0, 34.0, length(P));
        vec3 horizonCol = sky(normalize(vec3(d.x, 0.0, d.z)), 0.0) * 0.88;

        // water: the roost lake in front of the dike, scattered pools, and Ribe Å winding west to the sea
        float n = fbm(P * vec2(0.0034, 0.0052) + 3.7) + 0.30 * exp(-(P.x * P.x / 270000.0 + (P.y + 260.0) * (P.y + 260.0) / 44000.0));
        float wide = 0.012 + lod * 0.12;
        float shore = n - 0.60;
        float lake = smoothstep(-wide, wide, shore);
        float rc = abs(P.x - 210.0 - 150.0 * sin(P.y * 0.0031) - 70.0 * sin(P.y * 0.0083 + 1.7) - 90.0 * (vn(vec2(P.y * 0.006, 4.0)) - 0.5)) + (vn(P * 0.09) - 0.5) * 7.0;
        float rw = 7.5 + 3.5 * sin(P.y * 0.004 + 0.8);
        float river = (1.0 - smoothstep(rw - foot * 0.5 - 1.0, rw + foot * 0.5 + 1.0, rc)) * clamp(2.0 * rw / foot, 0.0, 1.0);

        // beyond the sea dike to the west lies the Wadden Sea: shallow water over tidal flats
        float sea = 1.0 - smoothstep(-40.0 - foot, 40.0 + foot, P.y + 3000.0 + 260.0 * (vn(vec2(P.x * 0.0012, 9.0)) - 0.5));
        float flats = mix(0.55, 1.0, smoothstep(0.35, 0.65, vn(P * 0.0016 + 5.0)));

        // fields: long narrow strips between ditches, each row offset from the next
        vec2 cs = vec2(64.0, 440.0);
        vec2 cell = (mat2(0.94, 0.34, -0.34, 0.94) * P) / cs;
        cell.x += hash(vec2(floor(cell.y), 3.0)) * 7.0;
        vec2 id = floor(cell);
        vec2 dl = (0.5 - abs(fract(cell) - 0.5)) * cs;
        vec2 hw = vec2(0.9, 2.4);
        vec2 cv = (1.0 - smoothstep(hw - foot * 0.5, hw + foot * 0.5, dl)) * clamp(2.0 * hw / foot, 0.0, 1.0);
        float ditch = max(cv.x, cv.y) * clamp(-d.y * 5.0, 0.12, 0.8);
        float tone = hash(id + 7.0), kind = hash(id + 31.0);

        float g1 = vn(P * 0.02), g2 = vn(P * 0.31), g3 = vn(P * 3.1);
        float fade = 1.0 - lod * 0.7;
        vec3 grass = mix(vec3(0.040, 0.060, 0.030), vec3(0.112, 0.102, 0.056), tone * fade);      // grazed pasture to dry hay meadow
        grass = mix(grass, vec3(0.070, 0.056, 0.040), step(0.84, kind) * fade);                   // the odd ploughed strip
        float mown = sin(fract(cell.x) * 75.0) * step(0.55, tone) * (1.0 - smoothstep(0.8, 2.5, foot));   // swaths left by the mower
        vec3 land = grass * (0.74 + 0.34 * g1 + 0.22 * g2 * (1.0 - lod) + 0.20 * g3 * (1.0 - smoothstep(0.0, 120.0, t)) + 0.05 * mown);

        // reed beds along the shores, where the starlings come down to roost
        float reedBand = (1.0 - smoothstep(0.0, 0.030 + wide, abs(shore + 0.016))) * (1.0 - lake);
        reedBand = clamp(max(reedBand, (1.0 - smoothstep(rw, rw + 10.0 + foot, rc)) * (1.0 - river)), 0.0, 1.0);
        land = mix(land, vec3(0.120, 0.090, 0.048) * (0.75 + 0.5 * g2), reedBand * 0.9);
        land = mix(land, vec3(0.070, 0.064, 0.058), sea);                                          // wet sand of the flats
        land += vec3(0.16, 0.075, 0.03) * pow(max(dot(normalize(d.xz), normalize(uSun.xz)), 0.0), 6.0) * 0.45;   // low sun raking across the grass

        // water mirrors the sky at a low angle and goes dark when you look straight down
        float wet = max(max(max(lake, river), ditch * (1.0 - reedBand)) * (1.0 - sea), sea * flats) * nearMask;
        c = land;
        if (wet > 0.003) {
          vec2 rp = vec2(vn(P * 0.33 + uTime * 0.32), vn(P * 0.33 + 31.0 - uTime * 0.27)) - 0.5;
          vec3 rd = normalize(vec3(d.x + rp.x * 0.07 * (1.0 - lod), -d.y + 0.002, d.z + rp.y * 0.07 * (1.0 - lod)));
          float fres = 0.05 + 0.95 * pow(1.0 - clamp(-d.y, 0.0, 1.0), 5.0);
          vec3 water = sky(rd, 1.0) * fres * 0.92 + vec3(0.010, 0.018, 0.026) * (1.0 - fres);
          c = mix(land, water, wet);
        }
        // evening mist gathers in patches over the wet ground
        float mist = smoothstep(0.36, 0.76, fbm(P * 0.0019 + vec2(uTime * 0.004, 11.0))) * (1.0 - exp(-t / 450.0));
        c = mix(c, mix(vec3(0.24, 0.25, 0.31), horizonCol, 0.45), mist * 0.50);
        c = mix(c, horizonCol, 1.0 - exp(-t / 2600.0));
      }
      vec3 over = max(c - 0.6, 0.0);
      c = min(c, 0.6) + 0.4 * (1.0 - exp(-over / 0.4));
      c += (hash(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) * (1.6 / 255.0);
      o = vec4(c, 1.0);
    }`);

  /* ---------- birds ---------- */
  const birdProg = program(`#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;     // right, up, forward; wingspan = 1
    layout(location=4) in vec4 aNrmW;    // normal, wing weight (on a wing, x is the edge: 1 leading, -1 trailing)
    layout(location=1) in vec3 iPos;
    layout(location=2) in vec4 iVel;     // velocity, bank
    layout(location=3) in vec4 iSeed;
    uniform mat4 uVP; uniform vec3 uCam, uSun;
    uniform float uTime, uSimT, uPx, uCopy, uSize, uSpread, uMinPx, uFar, uAlpha, uHaze, uStar, uStill, uShut, uFree, uAir, uLand;
    uniform vec4 uHere, uSelf;           // the viewer: where it flies and how far inside it is; its own bird (seed now, seed before, how far changed)
    uniform vec3 uHead; uniform vec4 uKeep;   // its heading; the room it keeps (metres to the side, metres ahead), and the bubble of free birds around it (radius, how far it has formed)
    uniform vec4 uWave[3];
    uniform vec4 uScare;                 // where a click startled the flock, and when
    out float vA; out vec3 vCol;
    void main(){
      vec3 f0 = normalize(iVel.xyz);
      vec3 r0 = normalize(cross(f0, vec3(0.0, 1.0, 0.0)));
      vec3 u0 = cross(r0, f0);
      vec3 s = fract(iSeed.xyz * (1.0 + uCopy * 1.618) + uCopy * 0.37) - 0.5;
      float copy = min(uCopy, 1.0), shownHere = 1.0;
      // A copy keeps its place from its parent by the compass, not by the parent's heading. So in a turn it flies the
      // arc its parent flies, a little to one side, and does not swing round it like a spoke: measured flocks turn on
      // equal radii, each bird on its own arc, and the birds change places as they do.
      // When the flock comes down for the night its copies come down with it, and a bird among the reeds is not seen.
      vec3 c = iPos + s * vec3(2.1, 1.3 * mix(1.0, clamp((iPos.y - 2.0) / 12.0, 0.0, 1.0), uLand), 2.1) * uSpread * copy;
      vec3 dv = c - uHere.xyz;
      // The birds nearest the viewer are not copies: they fly free, as one group with the viewer, and are drawn in a pass
      // of their own. Over the outer two metres of their bubble they fade out and the copies fade in.
      if (uFree > 0.5) shownHere = uKeep.w * (1.0 - smoothstep(uKeep.z - 2.0, uKeep.z, length(dv)));
      else if (uHere.w > 0.0 && dot(dv, dv) < 256.0) {
        // Around the viewer the copies of a bird stop being a fixed escort: each drifts a few decimetres over tens of
        // seconds, as neighbours do in a flock that flies this well aligned.
        vec3 q = iSeed.yzx * 6.2832 + uCopy * vec3(1.3, 2.1, 0.7);
        vec3 d = sin(uTime * vec3(0.19, 0.13, 0.23) * (0.7 + 0.6 * fract(iSeed.w * 7.0 + uCopy * 0.31)) + q) * vec3(0.55, 0.3, 0.55);
        c += d * copy * uHere.w * (1.0 - smoothstep(10.0, 16.0, length(dv)));
        dv = c - uHere.xyz;
